<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="validation.js" defer></script> 
</head>
<body>
<div class='wrapper'>
    <h1>Login</h1>
    <p id="error-message"></p>
    <form id="form">
        <div>
            <label for="email-input">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M172-126q-53 0-89.5-36.5T46-252v-456q0-53 36.5-89.5T172-834h616q53 0 89.5 36.5T914-708v456q0 53-36.5 89.5T788-126H172Zm308-271 308-200v-111L480-508 172-708v111l308 200Z"/></svg>
            </label>
            <input type="email" name="email" id="email-input" placeholder="Email">
        </div>
        <div>
            <label for="password-input">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M252-49q-51.98 0-88.99-37.01Q126-123.03 126-175v-376q0-51.97 37.01-88.99Q200.02-677 252-677h13v-51q0-91 62.5-154.5T480-946q90 0 152.5 63.5T695-728v51h13q51.97 0 88.99 37.01Q834-602.97 834-551v376q0 51.97-37.01 88.99Q759.97-49 708-49H252Zm284.5-257.5Q560-330 560-363t-23.5-56.5Q513-443 480-443t-56.5 23.5Q400-396 400-363t23.5 56.5Q447-283 480-283t56.5-23.5ZM391-677h178v-51q0-38.33-25.5-65.17Q518-820 480-820t-63.5 26.83Q391-766.33 391-728v51Z"/></svg>
            </label>
            <input type="password" name="password" id="password-input" placeholder="Password">
        </div>
        <button type="submit">Login</button>
    </form>
    <p>New user? <a href="signup.html">Create an account</a></p>
</div>
</body>
</html>
